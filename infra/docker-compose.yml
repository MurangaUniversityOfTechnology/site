services:
  api:
    build:
      context: ../apps/api
    restart: unless-stopped
    env_file:
      - ../apps/api/.env
    extra_hosts:
      # lets the container reach Postgres running on the host itself — used
      # in production, where Postgres is not one of these services. Hardcoded
      # to the pinned gateway below rather than the "host-gateway" magic
      # value, which resolves to the default docker0 bridge (172.17.0.1),
      # not this custom network's gateway.
      - "host.docker.internal:172.28.0.1"
    # No published host port here — reached over the internal Docker network
    # by name (api:8000). docker-compose.local.yml publishes it for direct
    # local access; docker-compose.prod.yml puts Caddy in front instead.

  web:
    build:
      context: ../apps/web
    restart: unless-stopped
    env_file:
      - ../apps/web/.env.local
    depends_on:
      - api
    # Same as api above — no published port in the base file.

networks:
  default:
    # Pinned (rather than Docker's default dynamic subnet) so the host's
    # Postgres can allow-list this exact range in pg_hba.conf / bind to
    # this exact gateway IP in listen_addresses instead of a broad guess.
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1
