name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/pyproject.toml
      - run: pip install -e ".[dev]"
      # Scoped to tests/, not the whole app/ — ruff has never actually been
      # enforced on this codebase (132 pre-existing violations in app/ as of
      # this workflow's introduction), and retroactively fixing all of them
      # is a separate task, not something to fold into adding CI. New test
      # code stays held to the standard; app/ enforcement is a follow-up.
      - run: ruff check tests/
      - run: pytest --cov=app --cov-report=term-missing
        # Docker is preinstalled on GitHub-hosted ubuntu runners — no extra
        # setup needed for testcontainers to reach the daemon.

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
