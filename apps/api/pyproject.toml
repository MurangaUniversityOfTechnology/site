[project]
name = "mut-tech-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.5",
    "bcrypt>=4.2",
    "pyjwt>=2.9",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "itsdangerous>=2.2",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "testcontainers[postgres]>=4.9",
    "respx>=0.22",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: pure-function tests, no DB/container",
    "integration: exercises the API + Postgres testcontainer",
]

[tool.ruff]
# Alembic-generated revision files carry the migration template's own
# boilerplate style (Union[...] instead of X | Y, etc) — re-fixing them by
# hand would just get re-flagged the next time `alembic revision
# --autogenerate` runs, since that's the tool's own output style, not ours.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint.flake8-bugbear]
# B008 (no function calls in default arguments) is a real footgun for
# mutable-default bugs in general, but FastAPI's dependency injection is
# built entirely around calling Depends()/Cookie() as a parameter default —
# that's not a bug, it's the framework's documented pattern. Every FastAPI
# project using ruff configures this same allowlist.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Cookie"]
